name: Build DRH LUDO Android

# Yeh workflow har push par + manually trigger karne par chalti hai.
# 3 outputs banata hai:
#   1. Debug APK (universal)          → sideload / test build
#   2. Release APK per ABI (unsigned) → sideload production build
#   3. Release AAB (unsigned)         → Google Play Store upload ke liye
#
# Signing note: yeh workflow apne aap DEBUG-signed release banata hai
# taaki sirf phone par install ho sake. Play Store upload ke liye
# aap "release-signed" job use karo (neeche) — usme apna keystore
# GitHub Secrets mein daalna hoga.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:      # <- mobile browser se "Run workflow" button

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # ---------- DEBUG APK ----------
      - name: Build DEBUG APK (universal)
        run: flutter build apk --debug

      - name: Upload DEBUG APK
        uses: actions/upload-artifact@v4
        with:
          name: drh-ludo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # ---------- RELEASE APK per ABI ----------
      - name: Build RELEASE APK (split per ABI, debug-signed)
        run: flutter build apk --release --split-per-abi

      - name: Upload RELEASE APKs
        uses: actions/upload-artifact@v4
        with:
          name: drh-ludo-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # ---------- RELEASE AAB ----------
      - name: Build RELEASE AAB (for Play Store, debug-signed)
        run: flutter build appbundle --release

      - name: Upload RELEASE AAB
        uses: actions/upload-artifact@v4
        with:
          name: drh-ludo-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

